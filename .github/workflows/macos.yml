name: macOS

on:
  # dev-* are feature branches with PRs into dev; their push runs report on the PRs.
  push:
    branches: [main, dev, "dev-*"]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # to commit screenshots to dev and the screenshots branch

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle the app
        run: scripts/bundle.sh

      - name: Capture screenshots
        run: scripts/screenshots.sh docs/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: ignore

      - name: Commit screenshots to dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update screenshots [skip ci]"
          git pull --rebase origin dev
          git push origin HEAD:dev

      # Feature branches don't commit their PNGs, so their PRs into dev can't conflict over
      # binary files; the PR links to them on the screenshots branch instead.
      - name: Publish screenshots for a feature branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'dev-')
        run: scripts/publish-screenshots.sh "${{ github.ref_name }}"

      # TEMPORARY: what does SACSwitchToUser take? Stop at it in a debugger and disassemble it.
      - name: Inspect SACSwitchToUser
        continue-on-error: true
        run: |
          cat > /tmp/probe.swift <<'SWIFT'
          import Foundation
          let login = dlopen("/System/Library/PrivateFrameworks/login.framework/Versions/A/login", RTLD_NOW)
          let f = unsafeBitCast(dlsym(login, "SACSwitchToUser"), to: (@convention(c) (UInt) -> Int32).self)
          print(f(0))
          SWIFT
          swiftc -o /tmp/probe /tmp/probe.swift
          lldb --batch -o "breakpoint set -n SACSwitchToUser" -o run -o "disassemble -f" \
            -o "image lookup -n SACSwitchToUser -v" /tmp/probe 2>&1 | head -150

      # Last, because it sends this job's desktop session to the background.
      - name: Check Fast User Switching
        run: scripts/check-user-switching.sh
