name: macOS

on:
  # dev-* are feature branches with PRs into dev; their push runs report on the PRs.
  push:
    branches: [main, dev, "dev-*"]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # to commit screenshots to dev and the screenshots branch

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle the app
        run: scripts/bundle.sh

      - name: Capture screenshots
        run: scripts/screenshots.sh docs/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: ignore

      - name: Commit screenshots to dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update screenshots [skip ci]"
          git pull --rebase origin dev
          git push origin HEAD:dev

      # Feature branches don't commit their PNGs, so their PRs into dev can't conflict over
      # binary files; the PR links to them on the screenshots branch instead.
      - name: Publish screenshots for a feature branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'dev-')
        run: scripts/publish-screenshots.sh "${{ github.ref_name }}"

      # Last, because it sends this job's desktop session to the background.
      - name: Check Fast User Switching
        run: scripts/check-user-switching.sh

  # TEMPORARY: which keys does SACSwitchToUser's attribute dictionary use? One fresh Mac per
  # guess, since the first call that starts a switch makes loginwindow ignore the rest.
  probe-user-switch:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        variant: [ds-arrays, ds-strings, short-keys, record-name]
    steps:
      - run: |
          sudo sysadminctl -addUser alex -fullName "Alex Rivera" -password dockry-ci
          cat > /tmp/probe.swift <<'SWIFT'
          import Foundation
          let login = dlopen("/System/Library/PrivateFrameworks/login.framework/Versions/A/login", RTLD_NOW)
          let switchToUser = unsafeBitCast(dlsym(login, "SACSwitchToUser"), to: (@convention(c) (CFDictionary) -> Int32).self)
          let (variant, uid) = (CommandLine.arguments[1], CommandLine.arguments[2])
          let attributes: [String: Any] = switch variant {
          case "ds-arrays": ["dsAttrTypeStandard:RecordName": ["alex"], "dsAttrTypeStandard:UniqueID": [uid]]
          case "ds-strings": ["dsAttrTypeStandard:RecordName": "alex", "dsAttrTypeStandard:UniqueID": uid]
          case "short-keys": ["name": "alex", "uid": Int(uid)!]
          default: ["dsAttrTypeStandard:RecordName": "alex"]
          }
          print(variant, "result", switchToUser(attributes as CFDictionary))
          SWIFT
          swift /tmp/probe.swift "${{ matrix.variant }}" "$(id -u alex)"
          sleep 8
          echo "screen owner: $(stat -f %Su /dev/console)"
          log show --last 1m --style compact --predicate 'process == "loginwindow"' 2>/dev/null \
            | grep -v CFPasteboard | grep -iE "switch|fus|alex|user|uid" | head -80 || true

