name: Release

# Publishes the version on top of CHANGELOG.md as a GitHub release, Dockry-<version>, with
# Dockry.app for Apple silicon and Intel Macs as a disk image and a zip, and that version's notes.
# Runs when CHANGELOG.md changes on main, and does nothing if that version is already released.
# Started by hand from the Actions tab, it releases the chosen branch's version, or, if that
# version is already released, rebuilds its tagged commit and replaces its downloads.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write  # to create the tag and the release

jobs:
  # On Linux, so a push that adds no new version (a fixed typo, say) doesn't wait for a Mac.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(scripts/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/Dockry-$version"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: github.event_name != 'push' || needs.version.outputs.released != 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the tagged commit of an existing release
        if: needs.version.outputs.released == 'true'
        run: |
          git fetch --depth 1 origin tag "Dockry-$VERSION"
          git checkout "Dockry-$VERSION"

      - name: Test
        run: swift test

      - name: Bundle the app
        run: scripts/bundle.sh --universal

      - name: Zip the app
        # ditto keeps the bundle's signature and permissions intact, unlike zip.
        run: ditto -c -k --keepParent build/Dockry.app "build/Dockry-$VERSION.zip"

      - name: Make the disk image
        # The image shows Dockry next to a link to Applications, to drag it onto.
        run: |
          mkdir build/dmg
          cp -R build/Dockry.app build/dmg/
          ln -s /Applications build/dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on hosted runners; a retry clears it.
          for attempt in 1 2 3; do
            hdiutil create -volname "Dockry $VERSION" -srcfolder build/dmg -fs HFS+ \
              -format UDZO -ov "build/Dockry-$VERSION.dmg" && break
            [[ $attempt == 3 ]] && exit 1
            sleep 5
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="Dockry-$VERSION"
          files=("build/$tag.dmg" "build/$tag.zip")
          notes="$(scripts/version.sh --notes)

          Download **$tag.dmg** below, open it and drag Dockry to Applications. It runs on macOS 14 or later, on Apple silicon and Intel. ($tag.zip has the same app.)

          Dockry isn't notarized by Apple, so the first time macOS refuses to open it. See [Installing](https://github.com/$GITHUB_REPOSITORY#installing) for how to allow it and for the permissions it asks for."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Dockry $VERSION" --notes "$notes"
          fi
