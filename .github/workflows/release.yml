name: Release

# Started by hand from the Actions tab: publishes the version on top of the chosen branch's
# CHANGELOG.md as a GitHub release, Dockry-<version>, with Dockry.app for Apple silicon and Intel
# Macs as a disk image and a zip, and that version's notes. A version is released only once:
# if Dockry-<version> is already tagged, it fails, so add a new version to CHANGELOG.md first.
on:
  workflow_dispatch:

permissions:
  contents: write  # to create the tag and the release

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from CHANGELOG.md
        run: |
          version=$(scripts/version.sh)
          if git ls-remote --exit-code --tags origin "refs/tags/Dockry-$version"; then
            echo "::error::Dockry-$version is already released. Add a new version on top of CHANGELOG.md."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Bundle the app
        run: scripts/bundle.sh --universal

      - name: Zip the app
        # ditto keeps the bundle's signature and permissions intact, unlike zip.
        run: ditto -c -k --keepParent build/Dockry.app "build/Dockry-$VERSION.zip"

      - name: Make the disk image
        # The image shows Dockry next to a link to Applications, to drag it onto.
        run: |
          mkdir build/dmg
          cp -R build/Dockry.app build/dmg/
          ln -s /Applications build/dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on hosted runners; a retry clears it.
          for attempt in 1 2 3; do
            hdiutil create -volname "Dockry $VERSION" -srcfolder build/dmg -fs HFS+ \
              -format UDZO -ov "build/Dockry-$VERSION.dmg" && break
            [[ $attempt == 3 ]] && exit 1
            sleep 5
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="Dockry-$VERSION"
          files=("build/$tag.dmg" "build/$tag.zip")
          notes="$(scripts/version.sh --notes)

          ### Install

          1. Download **$tag.dmg** below, open it and drag Dockry into Applications. (**$tag.zip** has the same app.)
          2. The first time you open it, macOS can't verify the developer. Go to System Settings → Privacy & Security, scroll down, and click **Open Anyway**.
          3. Look for Dockry's icon in the menu bar. [Installing](https://github.com/$GITHUB_REPOSITORY#installing) explains the permissions it can ask for.

          Requires macOS 14 or later, on Apple silicon or Intel."
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Dockry $VERSION" --notes "$notes"
